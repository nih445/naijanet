<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naija network status</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--card:#f5f5f2;--tx:#1a1a18;--mu:#6b6b66;--bd:#dcdcd6;--okb:#e3f2d8;--okt:#2f5a0e;--slb:#faeeda;--slt:#6b4306;--dnb:#fcebeb;--dnt:#8a2222;--ac:#185fa5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1f1d;--card:#2a2a27;--tx:#f1efe8;--mu:#a8a69c;--bd:#444441;--okb:#27500a;--okt:#c0dd97;--slb:#633806;--slt:#fac775;--dnb:#791f1f;--dnt:#f7c1c1;--ac:#85b7eb}}
:root[data-theme="dark"]{--bg:#1f1f1d;--card:#2a2a27;--tx:#f1efe8;--mu:#a8a69c;--bd:#444441;--okb:#27500a;--okt:#c0dd97;--slb:#633806;--slt:#fac775;--dnb:#791f1f;--dnt:#f7c1c1;--ac:#85b7eb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:500;margin:0}
.mu{color:var(--mu);font-size:13px;margin:2px 0 0}
select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
select{width:100%;margin:12px 0}
.ban{border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}
.nm{font-weight:500;margin:0}
.pill{font-size:13px;padding:3px 10px;border-radius:8px}
.gr{background:var(--card);color:var(--mu)}.ok{background:var(--okb);color:var(--okt)}.sl{background:var(--slb);color:var(--slt)}.dn{background:var(--dnb);color:var(--dnt)}
.big{width:100%;margin-top:14px;min-height:48px;background:var(--ac);color:#fff;border:0;font-weight:500}
.sheet{background:var(--card);border-radius:12px;padding:14px;margin-top:14px}
.chip{display:inline-block;margin:0 6px 8px 0;min-height:44px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.msg{font-size:14px;margin:10px 0 0;min-height:20px}
.ta{width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:0 0 8px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}.ov{background:var(--card);border-radius:12px;padding:14px;margin:0 0 8px}
.w{width:22px;height:22px;vertical-align:-5px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.w path{opacity:.18}.w path.on{opacity:1;animation:pu 1.6s ease-in-out infinite}.w path.a2{animation-delay:.25s}.w path.a3{animation-delay:.5s}.w circle{fill:currentColor;stroke:none}.w.ok{color:var(--okt)}.w.sl{color:var(--slt)}.w.dn{color:var(--dnt)}.w.gr{color:var(--mu)}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.live{font-size:12px;font-weight:500;color:var(--okt);background:var(--okb);padding:3px 8px;border-radius:8px;vertical-align:middle;margin-left:8px}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:5px;animation:pu 1.2s infinite}
@media (prefers-reduced-motion:reduce){.w path.on,.live i{animation:none}}
.note{font-size:12px;color:var(--mu);margin-top:18px}
</style></head><body><main>
<h1>Network status <span class="live"><i></i>LIVE</span></h1>
<p class="mu">Live view of MTN, Airtel, Glo and 9mobile</p>
<select id="city" aria-label="State"></select>
<select id="town" aria-label="Town" style="margin-top:0"><option value="">Whole state</option></select>
<select id="win" aria-label="Time period" style="margin-top:0"><option value="3600000">Last hour</option><option value="21600000">Last 6 hours</option><option value="86400000" selected>Last 24 hours</option><option value="604800000">Last 7 days</option></select>
<div id="ban"></div><div id="list"></div>
<button class="big" id="open">Report a problem</button>
<div class="sheet" id="sheet" hidden>
<p class="nm">Which network?</p><div id="nets"></div>
<p class="nm">How is it?</p><div id="probs"></div>
<p class="nm">Your town (optional, helps a lot)</p><input class="ta" id="rw" maxlength="30" list="tl" placeholder="Example: Umunze"><datalist id="tl"></datalist>
<button class="big" id="send" style="margin-top:4px">Send report</button>
<p class="msg" id="msg" role="status"></p>
</div>
<button class="big" id="fbopen" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)">Send feedback</button>
<div class="sheet" id="fb" hidden>
<p class="nm">Tell us your network problem</p>
<p class="mu" style="margin-bottom:8px">What happened, where, and when? Your words help us improve.</p>
<textarea class="ta" id="fbm" rows="5" maxlength="500" placeholder="Example: MTN data is very slow in Awka since morning"></textarea>
<input class="ta" id="fbc" maxlength="60" placeholder="Phone or WhatsApp (optional)">
<button class="big" id="fbsend" style="margin-top:4px">Send feedback</button>
<p class="msg" id="fbmsg" role="status"></p>
</div>
<p class="note" id="note">Loading reports…</p>
</main>
<script>
var DB="https://naijanet-d1c6d-default-rtdb.europe-west1.firebasedatabase.app";
var NET=["MTN","Airtel","Glo","9mobile"],PROB=["No signal","Slow data","Calls failing","SMS delayed","Working fine"];
var STATES=["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT Abuja","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
var sel=document.getElementById("city");STATES.forEach(function(s){var o=document.createElement("option");o.textContent=s;sel.appendChild(o)});
var sv=ls("st",'"Lagos"');sel.value=STATES.indexOf(sv)>-1?sv:"Lagos";
var reports=[],selN=null,selP=null,online=true;
function city(){return sel.value}
function key(s){return s.replace(/ /g,"_")}
function ls(k,d){try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ok(w){return typeof w==="string"&&/^[A-Za-z' -]{2,30}$/.test(w)}
function norm(w){return ok(w)?w.toLowerCase().replace(/\s+/g," ").trim():""}
function tc(w){return String(w).toLowerCase().replace(/(^|[ '-])([a-z])/g,function(m,a,b){return a+b.toUpperCase()})}
function T(){return norm(document.getElementById("town").value)}
function where(){var t=document.getElementById("town").value;return t?t+", "+city():city()}
function towns(){var c={},nm={};reports.forEach(function(r){var k=norm(r.w);if(k){c[k]=(c[k]||0)+1;nm[k]=tc(r.w)}});
var ks=Object.keys(c).sort(function(a,b){return c[b]-c[a]}).slice(0,40),t=document.getElementById("town"),cur=norm(t.value);
t.innerHTML='<option value="">Whole state</option>'+ks.map(function(k){return"<option>"+nm[k]+"</option>"}).join("");
t.value=cur&&ks.indexOf(cur)>-1?nm[cur]:"";
document.getElementById("tl").innerHTML=ks.map(function(k){return'<option value="'+nm[k]+'">'}).join("")}
function W(){return +document.getElementById("win").value}
function wl(){return{3600000:"in the last hour",21600000:"in the last 6 hours",86400000:"in the last 24 hours",604800000:"in the last 7 days"}[W()]||"recently"}
function stat(i){var h=Date.now()-W(),g=0,b=0;reports.forEach(function(r){if(r.n===i&&r.t>h&&(!T()||norm(r.w)===T())){if(r.p===4)g++;else b++}});var t=g+b;return{t:t,g:g,s:t?Math.round(g/t*100):null}}
function lab(o){if(o.t<3)return[o.t?"Too few reports":"No reports yet","gr"];return o.s>=70?["Good","ok"]:o.s>=40?["Unstable","sl"]:["Poor","dn"]}
function wifi(n,c,px){var a=["M9 15.5a5 5 0 0 1 6 0","M5.5 12a10 10 0 0 1 13 0","M2 8.5a15 15 0 0 1 20 0"],p="";a.forEach(function(d,k){p+='<path class="a'+(k+1)+(k<n?' on':'')+'" d="'+d+'"/>'});return'<svg class="w '+c+'" viewBox="0 0 24 24" style="width:'+px+'px;height:'+px+'px" aria-hidden="true">'+p+'<circle cx="12" cy="19" r="1.7"/></svg>'}
function lvl(o){return o.t<3?0:o.s>=70?3:o.s>=40?2:1}
function render(){
var h="",worst=null,tg=0,tt=0;
NET.forEach(function(n,i){var o=stat(i),l=lab(o);tg+=o.g;tt+=o.t;
if(o.t>=3&&o.s<40&&(!worst||o.s<worst.s))worst={n:n,s:o.s,t:o.t};
h+='<div class="row"><div><p class="nm">'+wifi(lvl(o),l[1],22)+n+'</p><p class="mu">'+o.t+' report'+(o.t===1?"":"s")+' '+wl()+'</p>'+(o.t>=3?'<div class="bar" style="width:140px"><i style="width:'+o.s+'%"></i></div>':'')+'</div><div style="text-align:right">'+(o.t>=3?'<p class="nm" style="font-size:22px">'+o.s+'%</p>':'')+'<span class="pill '+l[1]+'">'+l[0]+'</span></div></div>'});
var tw="";if(!T()){var m={};reports.forEach(function(r){var k=norm(r.w);if(k&&r.t>Date.now()-W()){var x=m[k]||(m[k]={n:tc(r.w),g:0,t:0});x.t++;if(r.p===4)x.g++}});
var low=Object.keys(m).map(function(k){var x=m[k];x.s=Math.round(x.g/x.t*100);return x}).filter(function(x){return x.t>=3&&x.s<70}).sort(function(a,b){return a.s-b.s||b.t-a.t}).slice(0,5);
if(low.length)tw='<div class="ov" style="background:var(--dnb)"><p class="nm" style="color:var(--dnt)">Towns with weak network</p>'+low.map(function(x){var c=x.s<40?["Low","dn"]:["Unstable","sl"];return'<div class="row tw" data-t="'+x.n+'" style="cursor:pointer"><div><p class="nm">'+x.n+'</p><p class="mu">'+x.t+' reports '+wl()+'. Tap to open</p></div><div style="text-align:right"><p class="nm" style="font-size:22px">'+x.s+'%</p><span class="pill '+c[1]+'">'+c[0]+'</span></div></div>'}).join("")+'</div>'}
var os=tt>=3?Math.round(tg/tt*100):null,oc=os===null?"var(--mu)":os>=70?"var(--okt)":os>=40?"var(--slt)":"var(--dnt)";
h='<div class="ov"><p class="mu">Overall network health in '+where()+'</p>'+(os===null?'<p class="nm" style="font-size:18px">Not enough reports yet</p><p class="mu">Tap Report a problem to help</p>':'<p style="font-size:44px;font-weight:500;margin:0;color:'+oc+'">'+wifi(os>=70?3:os>=40?2:1,os>=70?"ok":os>=40?"sl":"dn",36)+os+'%</p><div class="bar"><i style="width:'+os+'%"></i></div><p class="mu">from '+tt+' reports '+wl()+'</p>')+'</div>'+tw+h;
document.getElementById("list").innerHTML=h;
var b=document.getElementById("ban");
if(worst){b.className="ban dn";b.textContent=worst.n+" is poor in "+where()+": "+worst.s+"% healthy from "+worst.t+" reports"}
else{b.className="ban gr";b.textContent="No serious problems reported in "+where()}
document.getElementById("note").textContent=(online?"Live data from other users. Updates every 30 seconds.":"You're offline. Showing the last data.")+" Health % is the share of reports "+wl()+" saying the network works. It needs at least 3 reports."}
function load(){
var u=DB+"/reports/"+key(city())+".json?orderBy="+encodeURIComponent('"$key"')+"&limitToLast=1000";
return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){reports=d?Object.keys(d).map(function(k){return d[k]}):[];online=true;towns();render()}).catch(function(){online=false;render()})}
function post(r){return fetch(DB+"/reports/"+key(r.c)+".json",{method:"POST",body:JSON.stringify(r.w?{n:r.n,p:r.p,t:r.t,w:r.w}:{n:r.n,p:r.p,t:r.t})}).then(function(x){if(!x.ok)throw 0})}
function flush(){var q=ls("q","[]");if(!q.length)return;var rest=[];
q.reduce(function(p,r){return p.then(function(){return post(r)}).catch(function(){rest.push(r)})},Promise.resolve()).then(function(){lset("q",rest);load()})}
function chips(id,arr,setter){var el=document.getElementById(id);arr.forEach(function(t,i){var b=document.createElement("button");b.className="chip";b.textContent=t;
b.onclick=function(){setter(i);Array.prototype.forEach.call(el.children,function(x){x.classList.remove("on")});b.classList.add("on")};el.appendChild(b)})}
chips("nets",NET,function(i){selN=i});chips("probs",PROB,function(i){selP=i});
document.getElementById("open").onclick=function(){var s=document.getElementById("sheet");s.hidden=!s.hidden};
sel.onchange=function(){lset("st",city());reports=[];towns();document.getElementById("rw").value="";render();load()};
var wsel=document.getElementById("win"),wv=ls("win",'"86400000"');if(["3600000","21600000","86400000","604800000"].indexOf(wv)>-1)wsel.value=wv;wsel.onchange=function(){lset("win",wsel.value);render()};
document.getElementById("list").onclick=function(e){var el=e.target.closest?e.target.closest(".tw"):null;if(!el)return;var t=document.getElementById("town");t.value=el.getAttribute("data-t");document.getElementById("rw").value=t.value;render()};
document.getElementById("town").onchange=function(){document.getElementById("rw").value=this.value;render()};
document.getElementById("send").onclick=function(){
var m=document.getElementById("msg");
if(selN===null||selP===null){m.textContent="Pick a network and a problem first";return}
var w=document.getElementById("rw").value.trim();if(w&&!ok(w)){m.textContent="Town can only use letters and spaces";return}
var last=ls("last","{}"),k=city()+selN;
if(last[k]&&Date.now()-last[k]<6e5){m.textContent="You already reported "+NET[selN]+" here in the last 10 minutes";return}
last[k]=Date.now();lset("last",last);
var r={c:city(),n:selN,p:selP,t:Date.now()};if(w)r.w=tc(w);
post(r).then(function(){m.textContent="Report sent. Thank you";load()}).catch(function(){var q=ls("q","[]");q.push(r);lset("q",q);m.textContent="No connection. Saved and will send when you're back online"})};
document.getElementById("fbopen").onclick=function(){var f=document.getElementById("fb");f.hidden=!f.hidden};
document.getElementById("fbsend").onclick=function(){
var m=document.getElementById("fbm").value.trim(),c=document.getElementById("fbc").value.trim(),o=document.getElementById("fbmsg"),b=document.getElementById("fbsend");
if(m.length<3){o.textContent="Please write a few words first";return}
var d={m:m.slice(0,500),s:city(),t:Date.now()};if(c)d.c=c.slice(0,60);
b.disabled=true;
fetch(DB+"/feedback.json",{method:"POST",body:JSON.stringify(d)}).then(function(x){if(!x.ok)throw 0;document.getElementById("fbm").value="";o.textContent="Thank you. Your feedback was sent";b.disabled=false}).catch(function(){o.textContent="Could not send. Check your connection and try again";b.disabled=false})};
window.addEventListener("online",flush);
render();load().then(flush);setInterval(load,30000);
</script></body></html>
